<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>上傳內容 - 數學與 AI 知識庫</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="navbar"></div>

  <main class="max-w-3xl mx-auto px-4 py-8">
    <form id="uploadForm" class="bg-white p-6 rounded-xl border space-y-5 shadow-sm">
      <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold">新增內容</h1>
        <button type="button" id="autoDetectBtn"
          class="text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1.5 rounded-lg hover:bg-indigo-100 font-medium">
          ✨ 自動偵測分類
        </button>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">標題</label>
        <input id="title" type="text" required class="w-full border rounded-lg px-3 py-2" placeholder="例如：梯度下降法推導" />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">主分類（自動判斷 / 可手動改）</label>
          <select id="category" class="w-full border rounded-lg px-3 py-2 bg-white"></select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">子分類（可選或自訂新分類）</label>
          <input id="subcategory" list="subcategoryList" type="text" class="w-full border rounded-lg px-3 py-2" placeholder="例如：線性代數" />
          <datalist id="subcategoryList"></datalist>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">原文語系</label>
          <select id="lang" class="w-full border rounded-lg px-3 py-2 bg-white"></select>
        </div>
      </div>
      <p id="classifyHint" class="text-xs text-indigo-600 -mt-2 hidden"></p>

      <div>
        <label class="block text-sm font-medium mb-1">內容類型</label>
        <select id="mode" class="w-full border rounded-lg px-3 py-2 bg-white">
          <option value="text">直接貼上 Markdown / LaTeX 數學公式</option>
          <option value="file">上傳檔案（PDF / Word .docx / PPT .pptx / .md / .tex）</option>
        </select>
      </div>

      <div id="textAreaBox">
        <label class="block text-sm font-medium mb-1">內文（支援 $行內公式$ 與 $$區塊公式$$）</label>
        <textarea id="rawText" rows="8" class="w-full border rounded-lg p-3 font-mono text-sm"
          placeholder="# 標題&#10;行內公式：$E = mc^2$&#10;&#10;$$\int_0^\infty e^{-x^2} dx = \frac{\sqrt{\pi}}{2}$$"></textarea>
      </div>

      <div id="fileBox" class="hidden">
        <label class="block text-sm font-medium mb-1">選擇檔案</label>
        <input id="fileInput" type="file" accept=".pdf,.docx,.pptx,.md,.tex" class="w-full border rounded-lg p-2" />
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700">
        發布至網站
      </button>
      <p id="statusMsg" class="text-sm text-center"></p>
    </form>
  </main>

  <script type="module">
    import { mountNavbar } from './components/navbar.js';
    import { CATEGORIES } from './config/categories.config.js';
    import { APP_CONFIG } from './config/app.config.js';
    import { getCurrentUser } from './modules/auth.module.js';
    import { uploadFile, createPost } from './modules/db.module.js';
    import { autoClassifyPost, SUGGESTED_SUBCATEGORIES } from './modules/classifier.module.js';

    mountNavbar();

    const user = await getCurrentUser();
    if (!user) {
      alert('請先登入才能上傳內容');
      window.location.href = './login.html';
    }

    const categoryEl = document.getElementById('category');
    const subEl = document.getElementById('subcategory');
    const subListEl = document.getElementById('subcategoryList');
    const hintEl = document.getElementById('classifyHint');
    const titleEl = document.getElementById('title');
    const rawTextEl = document.getElementById('rawText');

    categoryEl.innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
    document.getElementById('lang').innerHTML = APP_CONFIG.LANGUAGES.map(l => `<option value="${l.code}">${l.label}</option>`).join('');

    function refreshSubcategoryOptions() {
      const list = SUGGESTED_SUBCATEGORIES[categoryEl.value] || [];
      subListEl.innerHTML = list.map(name => `<option value="${name}"></option>`).join('');
    }
    refreshSubcategoryOptions();

    // 追蹤使用者是否手動改過分類（避免蓋掉手動設定）
    let userManuallyEdited = false;
    categoryEl.onchange = () => {
      userManuallyEdited = true;
      refreshSubcategoryOptions();
    };
    subEl.oninput = () => { userManuallyEdited = true; };

    function runAutoClassify(force = false) {
      if (!force && userManuallyEdited) return;
      const title = titleEl.value.trim();
      const body = rawTextEl.value.trim();
      if (!title && !body) return;

      const result = autoClassifyPost(title, body);
      categoryEl.value = result.category;
      refreshSubcategoryOptions();
      subEl.value = result.subcategory;

      const catObj = CATEGORIES.find(c => c.id === result.category);
      hintEl.textContent = `✨ 已自動歸類為：${catObj?.name || result.category} → #${result.subcategory}（您可隨時手動更改）`;
      hintEl.classList.remove('hidden');
    }

    // 貼上或輸入完畢時自動判斷分類
    titleEl.addEventListener('blur', () => runAutoClassify(false));
    rawTextEl.addEventListener('blur', () => runAutoClassify(false));
    document.getElementById('autoDetectBtn').onclick = () => {
      userManuallyEdited = false;
      runAutoClassify(true);
    };

    // 切換輸入模式
    const modeEl = document.getElementById('mode');
    modeEl.onchange = () => {
      document.getElementById('textAreaBox').classList.toggle('hidden', modeEl.value !== 'text');
      document.getElementById('fileBox').classList.toggle('hidden', modeEl.value !== 'file');
    };

    // 送出表單
    document.getElementById('uploadForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('statusMsg');
      btn.disabled = true;
      msg.textContent = '處理中...';

      try {
        // 若子分類空白，送出前自動跑一次分類
        if (!subEl.value.trim()) {
          runAutoClassify(true);
        }

        let postData = {
          title: titleEl.value.trim(),
          category: categoryEl.value,
          subcategory: subEl.value.trim() || '未分類',
          original_lang: document.getElementById('lang').value,
          format: 'markdown',
          raw_text: null,
          file_url: null
        };

        if (modeEl.value === 'text') {
          postData.raw_text = rawTextEl.value;
        } else {
          const file = document.getElementById('fileInput').files[0];
          if (!file) throw new Error('請選擇要上傳的檔案');
          const ext = file.name.split('.').pop().toLowerCase();

          if (ext === 'md' || ext === 'tex') {
            postData.format = ext === 'tex' ? 'latex' : 'markdown';
            postData.raw_text = await file.text();
            if (!userManuallyEdited) {
              const auto = autoClassifyPost(postData.title, postData.raw_text);
              postData.category = auto.category;
              postData.subcategory = auto.subcategory;
            }
          } else {
            const uploaded = await uploadFile(file);
            postData.format = uploaded.ext;
            postData.file_url = uploaded.url;
          }
        }

        const created = await createPost(postData);
        window.location.href = `./viewer.html?id=${created.id}`;
      } catch (err) {
        msg.textContent = `錯誤：${err.message}`;
        msg.className = 'text-sm text-center text-red-500';
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
