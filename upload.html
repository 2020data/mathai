<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新增稿件</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles/editorial.css" />
</head>
<body class="min-h-screen">
  <div id="navbar"></div>

  <main class="max-w-3xl mx-auto px-5 py-10">
    <form id="uploadForm" class="bg-white rounded-lg border border-[#E4E0D6] p-6 sm:p-8 space-y-6">
      <div class="flex items-center justify-between pb-4 border-b border-[#E4E0D6]">
        <h1 id="pageHeading" class="font-serif-editorial text-3xl font-semibold text-stone-900"></h1>
        <button type="button" id="autoDetectBtn"
          class="inline-flex items-center gap-1.5 text-xs border border-[#D8D3C6] bg-[#F6F4EF] text-stone-700 px-3 py-1.5 rounded-full hover:bg-stone-900 hover:text-[#F6F4EF] transition">
        </button>
      </div>

      <!-- 標題 -->
      <div>
        <label id="lblTitle" class="block text-xs font-medium uppercase tracking-wider text-stone-500 mb-1.5"></label>
        <input id="title" type="text" required
          class="w-full border border-[#DDD8CC] rounded px-3.5 py-2.5 text-sm focus:outline-none focus:border-stone-900"
          placeholder="例如：高斯積分的極座標推導" />
      </div>

      <!-- 主分類 / 子分類 / 語系 -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label id="lblCat" class="block text-xs font-medium uppercase tracking-wider text-stone-500 mb-1.5"></label>
          <select id="category" class="w-full border border-[#DDD8CC] rounded px-3 py-2 text-sm bg-white"></select>
        </div>
        <div>
          <label id="lblSub" class="block text-xs font-medium uppercase tracking-wider text-stone-500 mb-1.5"></label>
          <input id="subcategory" list="subcategoryList" type="text"
            class="w-full border border-[#DDD8CC] rounded px-3 py-2 text-sm" placeholder="線性代數" />
          <datalist id="subcategoryList"></datalist>
        </div>
        <div>
          <label id="lblLang" class="block text-xs font-medium uppercase tracking-wider text-stone-500 mb-1.5"></label>
          <select id="lang" class="w-full border border-[#DDD8CC] rounded px-3 py-2 text-sm bg-white"></select>
        </div>
      </div>
      <p id="classifyHint" class="text-xs text-stone-500 -mt-3 hidden"></p>

      <!-- 封面照片區（外部圖床連結 / 上傳照片 / 精選免費圖庫） -->
      <div class="p-4 rounded bg-[#F6F4EF]/80 border border-[#E4E0D6] space-y-3">
        <label id="lblCover" class="block text-xs font-medium uppercase tracking-wider text-stone-600"></label>

        <div class="flex flex-wrap gap-2" id="coverTabs">
          <button type="button" data-tab="url" class="cover-tab inline-flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full bg-stone-900 text-[#F6F4EF]"></button>
          <button type="button" data-tab="upload" class="cover-tab inline-flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full border border-[#D8D3C6] bg-white text-stone-700"></button>
          <button type="button" data-tab="gallery" class="cover-tab inline-flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full border border-[#D8D3C6] bg-white text-stone-700"></button>
        </div>

        <!-- Tab 1: 外部連結 -->
        <div id="coverTabUrl">
          <input id="coverUrlInput" type="url"
            class="w-full border border-[#DDD8CC] bg-white rounded px-3 py-2 text-sm focus:outline-none focus:border-stone-900" />
        </div>

        <!-- Tab 2: 上傳照片 -->
        <div id="coverTabUpload" class="hidden space-y-2">
          <input id="coverFileInput" type="file" accept="image/*" class="w-full border border-[#DDD8CC] bg-white rounded p-2 text-xs" />
          <p id="coverUploadStatus" class="text-xs text-stone-500"></p>
        </div>

        <!-- Tab 3: 免費精選圖庫 -->
        <div id="coverTabGallery" class="hidden grid grid-cols-2 sm:grid-cols-3 gap-2.5"></div>

        <!-- 即時預覽 -->
        <div id="coverPreviewWrap" class="hidden relative mt-2">
          <img id="coverPreviewImg" alt="Cover preview" class="w-full h-44 object-cover rounded border border-[#E4E0D6]" />
          <button type="button" id="clearCoverBtn"
            class="absolute top-2 right-2 bg-stone-900/80 text-white text-[11px] px-2.5 py-1 rounded-full hover:bg-stone-900">
            清除封面
          </button>
        </div>
      </div>

      <!-- 內容模式 -->
      <div>
        <label id="lblMode" class="block text-xs font-medium uppercase tracking-wider text-stone-500 mb-1.5"></label>
        <select id="mode" class="w-full border border-[#DDD8CC] rounded px-3 py-2 text-sm bg-white"></select>
      </div>

      <!-- 文字編輯區 -->
      <div id="textAreaBox" class="space-y-2">
        <div class="flex items-center justify-between">
          <label id="lblBody" class="block text-xs font-medium uppercase tracking-wider text-stone-500"></label>
          <button type="button" id="insertInlineImgBtn"
            class="inline-flex items-center gap-1 text-xs text-stone-600 hover:text-stone-900 underline underline-offset-4">
          </button>
        </div>
        <textarea id="rawText" rows="10"
          class="w-full border border-[#DDD8CC] rounded p-3.5 font-mono-meta text-sm focus:outline-none focus:border-stone-900"
          placeholder="# 標題&#10;行內公式：$E = mc^2$&#10;&#10;$$\int_0^\infty e^{-x^2} dx = \frac{\sqrt{\pi}}{2}$$"></textarea>
      </div>

      <!-- 檔案上傳區 -->
      <div id="fileBox" class="hidden">
        <input id="fileInput" type="file" accept=".pdf,.docx,.pptx,.md,.tex" class="w-full border border-[#DDD8CC] rounded p-2.5 text-sm" />
      </div>

      <button type="submit" id="submitBtn"
        class="w-full bg-stone-900 text-[#F6F4EF] py-3 rounded text-sm font-medium tracking-wide hover:bg-stone-800 transition">
      </button>
      <p id="statusMsg" class="text-xs text-center text-stone-500"></p>
    </form>
  </main>

  <script type="module">
    import { mountNavbar } from './components/navbar.js';
    import { CATEGORIES, getCategoryLabel } from './config/categories.config.js';
    import { APP_CONFIG } from './config/app.config.js';
    import { getCurrentUser } from './modules/auth.module.js';
    import { uploadFile, createPost } from './modules/db.module.js';
    import { autoClassifyPost, SUGGESTED_SUBCATEGORIES } from './modules/classifier.module.js';
    import { CURATED_COVERS, validateImageUrl, uploadCoverImage } from './modules/media.module.js';
    import { getUiLang, t } from './modules/i18n.module.js';
    import { icon } from './modules/icons.module.js';

    mountNavbar();

    const user = await getCurrentUser();
    if (!user) {
      alert('請先登入才能新增內容');
      window.location.href = './login.html';
    }

    const lang = getUiLang();
    document.title = `${t('uploadHeading')} - ${t('siteTitle')}`;
    document.getElementById('pageHeading').textContent = t('uploadHeading');
    document.getElementById('autoDetectBtn').innerHTML = `${icon('compass', 'w-3.5 h-3.5')} <span>${t('reAutoDetect')}</span>`;
    document.getElementById('lblTitle').textContent = t('fieldTitle');
    document.getElementById('lblCat').textContent = t('fieldCategory');
    document.getElementById('lblSub').textContent = t('fieldSubcategory');
    document.getElementById('lblLang').textContent = t('fieldLang');
    document.getElementById('lblCover').textContent = t('fieldCover');
    document.getElementById('lblMode').textContent = t('fieldMode');
    document.getElementById('lblBody').textContent = t('fieldBody');
    document.getElementById('submitBtn').textContent = t('publishBtn');
    document.getElementById('coverUrlInput').placeholder = t('coverUrlPlaceholder');
    document.getElementById('insertInlineImgBtn').innerHTML = `${icon('image', 'w-3.5 h-3.5')} <span>${t('insertImgBtn')}</span>`;

    document.querySelector('[data-tab="url"]').innerHTML = `${icon('link', 'w-3.5 h-3.5')} ${t('tabUrl')}`;
    document.querySelector('[data-tab="upload"]').innerHTML = `${icon('upload', 'w-3.5 h-3.5')} ${t('tabUpload')}`;
    document.querySelector('[data-tab="gallery"]').innerHTML = `${icon('gallery', 'w-3.5 h-3.5')} ${t('tabGallery')}`;

    const modeEl = document.getElementById('mode');
    modeEl.innerHTML = `
      <option value="text">${t('modeText')}</option>
      <option value="file">${t('modeFile')}</option>
    `;

    const categoryEl = document.getElementById('category');
    const subEl = document.getElementById('subcategory');
    const subListEl = document.getElementById('subcategoryList');
    const langEl = document.getElementById('lang');
    const titleEl = document.getElementById('title');
    const rawTextEl = document.getElementById('rawText');
    const hintEl = document.getElementById('classifyHint');

    categoryEl.innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${getCategoryLabel(c, lang)}</option>`).join('');
    langEl.innerHTML = APP_CONFIG.LANGUAGES.map(l => `<option value="${l.code}">${l.label}</option>`).join('');
    // 預設原文語系跟隨系統預設語言或目前介面語言
    langEl.value = APP_CONFIG.DEFAULT_POST_LANG || lang;

    function refreshSubOptions() {
      const list = SUGGESTED_SUBCATEGORIES[categoryEl.value] || [];
      subListEl.innerHTML = list.map(n => `<option value="${n}"></option>`).join('');
    }
    refreshSubOptions();

    let userManuallyEdited = false;
    categoryEl.onchange = () => { userManuallyEdited = true; refreshSubOptions(); };
    subEl.oninput = () => { userManuallyEdited = true; };

    function runAutoClassify(force = false) {
      if (!force && userManuallyEdited) return;
      if (!titleEl.value.trim() && !rawTextEl.value.trim()) return;
      const res = autoClassifyPost(titleEl.value, rawTextEl.value);
      categoryEl.value = res.category;
      refreshSubOptions();
      subEl.value = res.subcategory;
      hintEl.textContent = `自動歸類：${res.category.toUpperCase()} / ${res.subcategory}`;
      hintEl.classList.remove('hidden');
    }

    titleEl.addEventListener('blur', () => runAutoClassify(false));
    rawTextEl.addEventListener('blur', () => runAutoClassify(false));
    document.getElementById('autoDetectBtn').onclick = () => { userManuallyEdited = false; runAutoClassify(true); };

    // === 封面圖片控制邏輯 ===
    let selectedCoverUrl = '';
    const coverUrlInput = document.getElementById('coverUrlInput');
    const coverPreviewWrap = document.getElementById('coverPreviewWrap');
    const coverPreviewImg = document.getElementById('coverPreviewImg');

    function setCoverPreview(url) {
      selectedCoverUrl = url || '';
      if (selectedCoverUrl) {
        coverPreviewImg.src = selectedCoverUrl;
        coverPreviewWrap.classList.remove('hidden');
      } else {
        coverPreviewWrap.classList.add('hidden');
        coverPreviewImg.removeAttribute('src');
      }
    }

    document.getElementById('clearCoverBtn').onclick = () => {
      coverUrlInput.value = '';
      setCoverPreview('');
    };

    coverUrlInput.addEventListener('change', () => {
      try {
        const valid = validateImageUrl(coverUrlInput.value);
        setCoverPreview(valid || '');
      } catch (err) {
        alert(err.message);
      }
    });

    // 切換封面分頁
    document.querySelectorAll('.cover-tab').forEach(btn => {
      btn.onclick = () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll('.cover-tab').forEach(b => {
          const active = b.dataset.tab === tab;
          b.className = active
            ? 'cover-tab inline-flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full bg-stone-900 text-[#F6F4EF]'
            : 'cover-tab inline-flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full border border-[#D8D3C6] bg-white text-stone-700';
        });
        document.getElementById('coverTabUrl').classList.toggle('hidden', tab !== 'url');
        document.getElementById('coverTabUpload').classList.toggle('hidden', tab !== 'upload');
        document.getElementById('coverTabGallery').classList.toggle('hidden', tab !== 'gallery');
      };
    });

    // 渲染精選免費圖庫
    const galleryEl = document.getElementById('coverTabGallery');
    galleryEl.innerHTML = CURATED_COVERS.map(item => `
      <button type="button" data-url="${item.url}"
        class="group relative aspect-[16/10] rounded overflow-hidden border border-[#DDD8CC] hover:border-stone-900 focus:outline-none">
        <img src="${item.url}" alt="${item.label}" class="w-full h-full object-cover group-hover:scale-105 transition" />
        <span class="absolute inset-x-0 bottom-0 bg-stone-900/65 text-white text-[10px] py-1 px-1.5 truncate">${item.label}</span>
      </button>
    `).join('');
    galleryEl.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => {
        coverUrlInput.value = btn.dataset.url;
        setCoverPreview(btn.dataset.url);
      };
    });

    // 上傳封面圖片（ImgBB 優先，退回 Supabase Storage）
    document.getElementById('coverFileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const status = document.getElementById('coverUploadStatus');
      status.textContent = '圖片上傳中...';
      try {
        const res = await uploadCoverImage(file);
        coverUrlInput.value = res.url;
        setCoverPreview(res.url);
        status.textContent = `已上傳至 ${res.provider}`;
      } catch (err) {
        status.textContent = `上傳失敗：${err.message}`;
      }
    });

    // 快速在內文插入外部圖片連結
    document.getElementById('insertInlineImgBtn').onclick = () => {
      const url = prompt('請貼上外部免費圖片網址（https://...）：');
      if (!url) return;
      try {
        const valid = validateImageUrl(url);
        const caption = prompt('圖片說明（選填）：') || '圖示';
        rawTextEl.value += `\n\n![${caption}](${valid})\n`;
      } catch (err) {
        alert(err.message);
      }
    };

    modeEl.onchange = () => {
      document.getElementById('textAreaBox').classList.toggle('hidden', modeEl.value !== 'text');
      document.getElementById('fileBox').classList.toggle('hidden', modeEl.value !== 'file');
    };

    document.getElementById('uploadForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('statusMsg');
      btn.disabled = true;
      msg.textContent = '發布處理中...';

      try {
        if (!subEl.value.trim()) runAutoClassify(true);

        const finalCover = selectedCoverUrl ? validateImageUrl(selectedCoverUrl) : null;
        let postData = {
          title: titleEl.value.trim(),
          category: categoryEl.value,
          subcategory: subEl.value.trim() || '未分類',
          original_lang: langEl.value,
          cover_image_url: finalCover,
          format: 'markdown',
          raw_text: null,
          file_url: null
        };

        if (modeEl.value === 'text') {
          postData.raw_text = rawTextEl.value;
        } else {
          const file = document.getElementById('fileInput').files[0];
          if (!file) throw new Error('請選擇檔案');
          const ext = file.name.split('.').pop().toLowerCase();
          if (ext === 'md' || ext === 'tex') {
            postData.format = ext === 'tex' ? 'latex' : 'markdown';
            postData.raw_text = await file.text();
            if (!userManuallyEdited) {
              const auto = autoClassifyPost(postData.title, postData.raw_text);
              postData.category = auto.category;
              postData.subcategory = auto.subcategory;
            }
          } else {
            const uploaded = await uploadFile(file);
            postData.format = uploaded.ext;
            postData.file_url = uploaded.url;
          }
        }

        const created = await createPost(postData);
        window.location.href = `./viewer.html?id=${created.id}`;
      } catch (err) {
        msg.textContent = `錯誤：${err.message}`;
        msg.className = 'text-xs text-center text-red-700';
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
