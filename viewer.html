<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>內容瀏覽</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- KaTeX 數學公式樣式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <!-- Mammoth.js 用於前端解析 Word (.docx) -->
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="navbar"></div>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <div id="headerBox" class="mb-4"></div>

    <!-- 作者專用：手動更改分類面板（預設隱藏） -->
    <div id="editCategoryPanel" class="hidden bg-indigo-50/70 border border-indigo-200 p-4 rounded-xl mb-6 text-sm">
      <div class="flex flex-wrap items-center gap-3">
        <span class="font-semibold text-indigo-900">🏷️ 修改文章分類：</span>
        <select id="editCategorySelect" class="border rounded-lg px-2.5 py-1.5 bg-white"></select>
        <input id="editSubcategoryInput" list="editSubList" type="text"
          class="border rounded-lg px-2.5 py-1.5 bg-white w-44" placeholder="輸入或選擇子分類" />
        <datalist id="editSubList"></datalist>

        <button id="reAutoClassifyBtn" type="button"
          class="border border-indigo-300 bg-white text-indigo-700 px-3 py-1.5 rounded-lg hover:bg-indigo-50">
          ✨ 重新自動判斷
        </button>
        <button id="saveCategoryBtn" type="button"
          class="bg-indigo-600 text-white px-4 py-1.5 rounded-lg hover:bg-indigo-700 font-medium">
          儲存分類
        </button>
        <button id="cancelCategoryBtn" type="button" class="text-slate-500 hover:text-slate-800">
          取消
        </button>
        <span id="editCategoryStatus" class="text-xs text-indigo-700 ml-auto"></span>
      </div>
    </div>

    <!-- 線上翻譯工具列（僅在純文字/MD/LaTeX 顯示） -->
    <div id="translateBar" class="hidden bg-white p-4 rounded-xl border mb-6 flex flex-wrap items-center gap-3 text-sm shadow-sm">
      <span class="font-semibold text-slate-700">🌐 線上翻譯：</span>
      <select id="translateMode" class="border rounded-lg px-2.5 py-1.5 bg-slate-50">
        <option value="free">免費線上翻譯 (直接用)</option>
        <option value="cloud">雲端 AI 翻譯 (Supabase)</option>
        <option value="local">地端本機 API (Localhost)</option>
      </select>
      <select id="targetLang" class="border rounded-lg px-2.5 py-1.5 bg-slate-50"></select>

      <button id="translateBtn" class="bg-blue-600 text-white px-4 py-1.5 rounded-lg hover:bg-blue-700 transition">
        立即翻譯
      </button>
      <button id="bilingualBtn" class="hidden border border-slate-300 text-slate-700 px-3 py-1.5 rounded-lg hover:bg-slate-100">
        切換雙語對照
      </button>
      <button id="resetOrigBtn" class="hidden text-slate-500 hover:text-slate-800 underline">
        還原原文
      </button>
      <span id="translateStatus" class="text-xs text-slate-500 ml-auto"></span>
    </div>

    <!-- 支援單欄與左右雙語對照的內容容器 -->
    <div id="viewerLayout" class="grid grid-cols-1 gap-6">
      <article id="contentContainer" class="bg-white p-6 sm:p-8 rounded-xl border shadow-sm">
        <p class="text-slate-400">載入中...</p>
      </article>
      <article id="translatedContainer" class="hidden bg-blue-50/30 p-6 sm:p-8 rounded-xl border border-blue-200 shadow-sm"></article>
    </div>
  </main>

  <script type="module">
    import { mountNavbar } from './components/navbar.js';
    import { APP_CONFIG } from './config/app.config.js';
    import { CATEGORIES, getCategoryById } from './config/categories.config.js';
    import { getCurrentUser } from './modules/auth.module.js';
    import { fetchPostById, deletePost, updatePostCategory } from './modules/db.module.js';
    import { renderPostContent } from './modules/parser.module.js';
    import { translatePost } from './modules/translator.module.js';
    import { autoClassifyPost, SUGGESTED_SUBCATEGORIES } from './modules/classifier.module.js';

    mountNavbar();

    const targetLangSelect = document.getElementById('targetLang');
    targetLangSelect.innerHTML = APP_CONFIG.LANGUAGES
      .map(l => `<option value="${l.code}">${l.label}</option>`)
      .join('');

    const id = new URLSearchParams(window.location.search).get('id');
    const container = document.getElementById('contentContainer');

    if (!id) {
      container.innerHTML = `<p class="text-red-500">缺少文章 ID，請從 <a href="./index.html" class="underline text-blue-600">首頁</a> 點選文章進入。</p>`;
    } else {
      try {
        const [post, currentUser] = await Promise.all([
          fetchPostById(id),
          getCurrentUser()
        ]);
        const isAuthor = currentUser && currentUser.id === post.user_id;
        document.title = post.title;

        function renderHeader() {
          const cat = getCategoryById(post.category);
          const sub = (post.subcategory || '').trim() || '未分類';

          document.getElementById('headerBox').innerHTML = `
            <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
              <div class="flex flex-wrap items-center gap-2">
                <span class="text-xs px-2.5 py-1 rounded-full border ${cat.badgeClass}">${cat.icon} ${cat.name}</span>
                <span class="text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 px-2.5 py-1 rounded-full"># ${sub}</span>
                <span class="text-xs bg-slate-200 px-2 py-1 rounded">原文語系：${post.original_lang}</span>
                <span class="text-xs text-slate-400 uppercase font-mono">${post.format}</span>
              </div>
              ${isAuthor ? `
                <div class="flex items-center gap-2">
                  <button id="toggleEditCatBtn" class="text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1 rounded-lg hover:bg-indigo-100">
                    🏷️ 更改分類
                  </button>
                  <button id="deletePostBtn" class="text-xs bg-red-50 text-red-600 border border-red-200 px-3 py-1 rounded-lg hover:bg-red-100">
                    🗑️ 刪除文章
                  </button>
                </div>
              ` : ''}
            </div>
            <h1 class="text-3xl font-bold text-slate-900">${post.title}</h1>
          `;

          // 綁定開啟分類編輯面板
          document.getElementById('toggleEditCatBtn')?.addEventListener('click', () => {
            const panel = document.getElementById('editCategoryPanel');
            panel.classList.toggle('hidden');
            if (!panel.classList.contains('hidden')) {
              editCatSelect.value = post.category;
              updateEditSubList();
              editSubInput.value = post.subcategory || '未分類';
              editStatus.textContent = '';
            }
          });

          // 綁定刪除按鈕
          document.getElementById('deletePostBtn')?.addEventListener('click', async () => {
            if (!confirm(`確定要刪除「${post.title}」嗎？刪除後無法復原。`)) return;
            try {
              await deletePost(post.id, post.file_url);
              alert('文章已刪除');
              window.location.href = './index.html';
            } catch (err) {
              alert(`刪除失敗：${err.message}`);
            }
          });
        }

        // 初始化分類修改面板控制項
        const editCatSelect = document.getElementById('editCategorySelect');
        const editSubInput = document.getElementById('editSubcategoryInput');
        const editSubList = document.getElementById('editSubList');
        const editStatus = document.getElementById('editCategoryStatus');

        editCatSelect.innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
        function updateEditSubList() {
          const list = SUGGESTED_SUBCATEGORIES[editCatSelect.value] || [];
          editSubList.innerHTML = list.map(name => `<option value="${name}"></option>`).join('');
        }
        editCatSelect.onchange = updateEditSubList;

        document.getElementById('reAutoClassifyBtn').onclick = () => {
          const res = autoClassifyPost(post.title, post.raw_text || '');
          editCatSelect.value = res.category;
          updateEditSubList();
          editSubInput.value = res.subcategory;
          editStatus.textContent = '✨ 已重新偵測，請按儲存分類';
        };

        document.getElementById('cancelCategoryBtn').onclick = () => {
          document.getElementById('editCategoryPanel').classList.add('hidden');
        };

        document.getElementById('saveCategoryBtn').onclick = async () => {
          editStatus.textContent = '儲存中...';
          try {
            const updated = await updatePostCategory(post.id, editCatSelect.value, editSubInput.value);
            post.category = updated.category;
            post.subcategory = updated.subcategory;
            renderHeader();
            document.getElementById('editCategoryPanel').classList.add('hidden');
          } catch (err) {
            editStatus.textContent = `❌ 儲存失敗：${err.message}`;
          }
        };

        renderHeader();
        await renderPostContent(container, post);

        // 若為 Markdown / LaTeX，顯示翻譯工具列
        if (post.format === 'markdown' || post.format === 'latex') {
          document.getElementById('translateBar').classList.remove('hidden');
          const defaultTarget = APP_CONFIG.LANGUAGES.find(l => l.code !== post.original_lang);
          if (defaultTarget) targetLangSelect.value = defaultTarget.code;

          let currentTranslatedText = null;
          let isBilingual = false;

          const layout = document.getElementById('viewerLayout');
          const transBox = document.getElementById('translatedContainer');
          const status = document.getElementById('translateStatus');
          const bilingualBtn = document.getElementById('bilingualBtn');
          const resetBtn = document.getElementById('resetOrigBtn');

          async function refreshView() {
            if (!currentTranslatedText) {
              layout.className = 'grid grid-cols-1 gap-6';
              transBox.classList.add('hidden');
              await renderPostContent(container, post);
              return;
            }
            if (isBilingual) {
              layout.className = 'grid grid-cols-1 lg:grid-cols-2 gap-6';
              transBox.classList.remove('hidden');
              await renderPostContent(container, post);
              await renderPostContent(transBox, post, currentTranslatedText);
            } else {
              layout.className = 'grid grid-cols-1 gap-6';
              transBox.classList.add('hidden');
              await renderPostContent(container, post, currentTranslatedText);
            }
          }

          document.getElementById('translateBtn').onclick = async () => {
            status.textContent = '翻譯中（已自動保護數學公式）...';
            try {
              const mode = document.getElementById('translateMode').value;
              const target = targetLangSelect.value;
              const { text, fromCache } = await translatePost(post, target, mode);
              currentTranslatedText = text;
              bilingualBtn.classList.remove('hidden');
              resetBtn.classList.remove('hidden');
              status.textContent = fromCache ? '⚡ 已從快取載入譯文' : '✅ 翻譯完成';
              await refreshView();
            } catch (err) {
              status.textContent = `❌ ${err.message}`;
            }
          };

          bilingualBtn.onclick = async () => {
            isBilingual = !isBilingual;
            bilingualBtn.textContent = isBilingual ? '切換單欄譯文' : '切換雙語對照';
            await refreshView();
          };

          resetBtn.onclick = async () => {
            currentTranslatedText = null;
            isBilingual = false;
            bilingualBtn.classList.add('hidden');
            resetBtn.classList.add('hidden');
            status.textContent = '';
            await refreshView();
          };
        }
      } catch (err) {
        container.innerHTML = `<p class="text-red-500">無法載入內容：${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
