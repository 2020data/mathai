<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>典藏瀏覽</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <link rel="stylesheet" href="./styles/editorial.css" />
</head>
<body class="min-h-screen">
  <div id="navbar"></div>

  <main class="max-w-5xl mx-auto px-5 py-10">
    <a id="backLink" href="./index.html" class="inline-flex items-center gap-1.5 text-xs font-mono-meta text-stone-500 hover:text-stone-900 mb-6 transition"></a>

    <div id="headerBox" class="mb-4"></div>
    <div id="postShareBar" class="mb-6"></div>

    <div id="heroCoverBox" class="hidden mb-8 rounded-lg overflow-hidden border border-[#E4E0D6] bg-white">
      <img id="heroCoverImg" alt="" class="w-full max-h-[420px] object-cover" />
    </div>

    <!-- 作者專用：手動修改分類面板 -->
    <div id="editCategoryPanel" class="hidden bg-white border border-[#D8D3C6] p-4 rounded-lg mb-6 text-sm">
      <div class="flex flex-wrap items-center gap-3">
        <span id="editCatLabel" class="inline-flex items-center gap-1.5 text-xs font-medium text-stone-700"></span>
        <select id="editCategorySelect" class="border border-[#DDD8CC] rounded px-2.5 py-1.5 text-xs bg-white"></select>
        <input id="editSubcategoryInput" list="editSubList" type="text"
          class="border border-[#DDD8CC] rounded px-2.5 py-1.5 text-xs bg-white w-44" />
        <datalist id="editSubList"></datalist>

        <button id="reAutoClassifyBtn" type="button"
          class="inline-flex items-center gap-1 text-xs border border-[#D8D3C6] px-3 py-1.5 rounded hover:bg-[#F6F4EF]"></button>
        <button id="saveCategoryBtn" type="button"
          class="text-xs bg-stone-900 text-[#F6F4EF] px-4 py-1.5 rounded hover:bg-stone-700"></button>
        <button id="cancelCategoryBtn" type="button" class="text-xs text-stone-500 hover:text-stone-900"></button>
        <span id="editCategoryStatus" class="font-mono-meta text-xs text-stone-500 ml-auto"></span>
      </div>
    </div>

    <article id="contentContainer" class="editorial-prose bg-white p-7 sm:p-11 rounded-lg border border-[#E4E0D6]">
      <p class="text-stone-400 font-mono-meta text-xs">Loading...</p>
    </article>
  </main>

  <script type="module">
    import { mountNavbar } from './components/navbar.js';
    import { CATEGORIES, getCategoryById, getCategoryLabel } from './config/categories.config.js';
    import { getCurrentUser } from './modules/auth.module.js';
    import { fetchPostById, deletePost, updatePostCategory } from './modules/db.module.js';
    import { renderPostContent } from './modules/parser.module.js';
    import { autoClassifyPost, SUGGESTED_SUBCATEGORIES } from './modules/classifier.module.js';
    import { mountShareBar } from './modules/share.module.js';
    import { autoTranslateIfNeeded } from './modules/translator.module.js';
    import { getUiLang, t } from './modules/i18n.module.js';
    import { icon } from './modules/icons.module.js';

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    mountNavbar();
    const uiLang = getUiLang();

    document.getElementById('backLink').innerHTML = `${icon('arrowLeft', 'w-3.5 h-3.5')} <span>${t('backToIndex')}</span>`;
    document.getElementById('editCatLabel').innerHTML = `${icon('tag', 'w-3.5 h-3.5')} <span>${t('editCategory')}</span>`;
    document.getElementById('reAutoClassifyBtn').innerHTML = `${icon('compass', 'w-3.5 h-3.5')} <span>${t('reAutoDetect')}</span>`;
    document.getElementById('saveCategoryBtn').textContent = t('saveCategory');
    document.getElementById('cancelCategoryBtn').textContent = t('cancel');

    const id = new URLSearchParams(window.location.search).get('id');
    const container = document.getElementById('contentContainer');

    if (!id) {
      container.innerHTML = `<p class="text-red-700 text-sm">缺少文章 ID，請從首頁進入。</p>`;
    } else {
      try {
        const [post, currentUser] = await Promise.all([fetchPostById(id), getCurrentUser().catch(() => null)]);
        const isAuthor = currentUser && currentUser.id === post.user_id;
        document.title = `${post.title} - ${t('siteTitle')}`;

        if (post.cover_image_url) {
          const heroImg = document.getElementById('heroCoverImg');
          heroImg.src = post.cover_image_url;
          heroImg.alt = post.title;
          document.getElementById('heroCoverBox').classList.remove('hidden');
        }

        const editCatSelect = document.getElementById('editCategorySelect');
        const editSubInput = document.getElementById('editSubcategoryInput');
        const editSubList = document.getElementById('editSubList');
        const editStatus = document.getElementById('editCategoryStatus');

        editCatSelect.innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${getCategoryLabel(c, uiLang)}</option>`).join('');
        function updateEditSubList() {
          const list = SUGGESTED_SUBCATEGORIES[editCatSelect.value] || [];
          editSubList.innerHTML = list.map(n => `<option value="${n}"></option>`).join('');
        }
        editCatSelect.onchange = updateEditSubList;

        function renderHeader() {
          const cat = getCategoryById(post.category);
          const catName = getCategoryLabel(cat, uiLang);
          const sub = (post.subcategory || '').trim() || t('uncategorized');
          const dateStr = new Date(post.created_at).toLocaleDateString(uiLang === 'en' ? 'en-US' : uiLang);

          document.getElementById('headerBox').innerHTML = `
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
              <div class="flex flex-wrap items-center gap-2">
                <span class="inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1 rounded-full border ${cat.badgeClass}">
                  ${icon(cat.iconKey, 'w-3.5 h-3.5')} ${escapeHtml(catName)}
                </span>
                <span class="text-xs bg-white border border-[#E4E0D6] text-stone-600 px-3 py-1 rounded-full">${escapeHtml(sub)}</span>
                <span class="font-mono-meta text-[11px] text-stone-400 uppercase">${t('origLang')}: ${escapeHtml(post.original_lang)} · ${escapeHtml(post.format)} · ${dateStr}</span>
              </div>
              ${isAuthor ? `
                <div class="flex items-center gap-2">
                  <button id="toggleEditCatBtn" class="inline-flex items-center gap-1.5 text-xs border border-[#D8D3C6] bg-white text-stone-700 px-3 py-1.5 rounded-full hover:bg-stone-900 hover:text-[#F6F4EF] transition">
                    ${icon('tag', 'w-3.5 h-3.5')} <span>${t('editCategory')}</span>
                  </button>
                  <button id="deletePostBtn" class="inline-flex items-center gap-1.5 text-xs border border-red-200 bg-white text-red-700 px-3 py-1.5 rounded-full hover:bg-red-700 hover:text-white transition">
                    ${icon('trash', 'w-3.5 h-3.5')} <span>${t('deletePost')}</span>
                  </button>
                </div>
              ` : ''}
            </div>
            <h1 class="font-serif-editorial text-3xl sm:text-5xl font-semibold text-stone-900 leading-tight">${escapeHtml(post.title)}</h1>
            ${post.creator_name ? `<p class="mt-2 text-xs font-mono-meta text-stone-500">創作者 / 編輯者：${escapeHtml(post.creator_name)}</p>` : ''}
          `;

          document.getElementById('toggleEditCatBtn')?.addEventListener('click', () => {
            const panel = document.getElementById('editCategoryPanel');
            panel.classList.toggle('hidden');
            if (!panel.classList.contains('hidden')) {
              editCatSelect.value = post.category;
              updateEditSubList();
              editSubInput.value = post.subcategory || t('uncategorized');
              editStatus.textContent = '';
            }
          });

          document.getElementById('deletePostBtn')?.addEventListener('click', async () => {
            if (!confirm(`確定要刪除「${post.title}」嗎？刪除後無法復原。`)) return;
            try {
              await deletePost(post.id, post.file_url);
              window.location.href = './index.html';
            } catch (err) {
              alert(`刪除失敗：${err.message}`);
            }
          });
        }

        document.getElementById('reAutoClassifyBtn').onclick = () => {
          const res = autoClassifyPost(post.title, post.raw_text || '');
          editCatSelect.value = res.category;
          updateEditSubList();
          editSubInput.value = res.subcategory;
          editStatus.textContent = '已重新判斷，請點擊儲存';
        };
        document.getElementById('cancelCategoryBtn').onclick = () => document.getElementById('editCategoryPanel').classList.add('hidden');
        document.getElementById('saveCategoryBtn').onclick = async () => {
          editStatus.textContent = '...';
          try {
            const updated = await updatePostCategory(post.id, editCatSelect.value, editSubInput.value);
            post.category = updated.category;
            post.subcategory = updated.subcategory;
            renderHeader();
            document.getElementById('editCategoryPanel').classList.add('hidden');
          } catch (err) {
            editStatus.textContent = err.message;
          }
        };

        renderHeader();
        mountShareBar(document.getElementById('postShareBar'), {
          title: post.title,
          url: window.location.href
        });

        await renderPostContent(container, post);
        autoTranslateIfNeeded(150);
      } catch (err) {
        container.innerHTML = `<p class="text-red-700 text-sm">無法載入內容：${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
