<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>數理與智識典藏 | Math & AI Archive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles/editorial.css" />
</head>
<body class="min-h-screen flex flex-col">
  <div id="navbar"></div>

  <!-- 刊物風格頁首 -->
  <section class="border-b border-[#E4E0D6] bg-white/40">
    <div class="max-w-7xl mx-auto px-5 py-10 sm:py-12">
      <p id="heroSubtitle" class="font-mono-meta text-[11px] uppercase tracking-[0.2em] text-stone-500 mb-3"></p>
      <h1 id="heroHeading" class="font-serif-editorial text-3xl sm:text-5xl font-semibold text-stone-900 max-w-3xl leading-tight mb-3"></h1>
      <p id="heroDesc" class="text-sm sm:text-base text-stone-600 max-w-2xl leading-relaxed"></p>
    </div>
  </section>

  <main class="max-w-7xl w-full mx-auto px-5 py-10 flex-1">
    <div class="flex flex-col lg:flex-row gap-8 items-start">
      <aside id="sidebarContainer" class="w-full lg:w-64 shrink-0"></aside>

      <section class="flex-1 w-full">
        <div class="flex flex-wrap items-baseline justify-between gap-2 pb-4 mb-6 border-b border-[#E4E0D6]">
          <h2 id="currentViewTitle" class="font-serif-editorial text-2xl font-semibold text-stone-900"></h2>
          <span id="postCountBadge" class="font-mono-meta text-xs text-stone-400"></span>
        </div>

        <div id="cardGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
          <p id="loadingText" class="text-stone-400 col-span-full text-center py-16 font-mono-meta text-xs"></p>
        </div>
      </section>
    </div>
  </main>

  <script type="module">
    import { mountNavbar } from './components/navbar.js';
    import { renderSidebar } from './components/sidebar.js';
    import { getCategoryById, getCategoryLabel } from './config/categories.config.js';
    import { getCurrentUser } from './modules/auth.module.js';
    import { fetchPosts, updatePostCategory } from './modules/db.module.js';
    import { autoClassifyPost } from './modules/classifier.module.js';
    import { getUiLang, t } from './modules/i18n.module.js';
    import { icon } from './modules/icons.module.js';

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    const lang = getUiLang();
    document.title = t('siteTitle');
    document.getElementById('heroSubtitle').textContent = t('siteSubtitle');
    document.getElementById('heroHeading').textContent = t('heroHeading');
    document.getElementById('heroDesc').textContent = t('heroDesc');
    document.getElementById('loadingText').textContent = t('loading');

    let allPosts = [];
    let currentUser = null;
    const state = { category: 'all', subcategory: 'all' };

    function renderView() {
      renderSidebar(document.getElementById('sidebarContainer'), allPosts, state, {
        currentUser,
        onSelect: (category, subcategory) => {
          state.category = category;
          state.subcategory = subcategory;
          renderView();
        },
        onAutoClassifyAll: handleBatchAutoClassify
      });

      const filtered = allPosts.filter(post => {
        if (state.category !== 'all' && post.category !== state.category) return false;
        const sub = (post.subcategory || '').trim() || t('uncategorized');
        if (state.subcategory !== 'all' && sub !== state.subcategory) return false;
        return true;
      });

      const titleEl = document.getElementById('currentViewTitle');
      if (state.category === 'all') {
        titleEl.textContent = t('allArticles');
      } else {
        const cat = getCategoryById(state.category);
        const catName = getCategoryLabel(cat, lang);
        titleEl.textContent = state.subcategory === 'all' ? catName : `${catName} — ${state.subcategory}`;
      }
      document.getElementById('postCountBadge').textContent = `${t('showingPrefix')} ${filtered.length} ${t('totalUnit')}`;

      const grid = document.getElementById('cardGrid');
      if (!filtered.length) {
        grid.innerHTML = `<p class="text-stone-400 col-span-full text-center py-16 text-sm">${t('noPosts')}</p>`;
        return;
      }

      grid.innerHTML = filtered.map(post => {
        const cat = getCategoryById(post.category);
        const catName = getCategoryLabel(cat, lang);
        const sub = (post.subcategory || '').trim() || t('uncategorized');
        const dateStr = new Date(post.created_at).toLocaleDateString(lang === 'en' ? 'en-US' : lang);

        const coverHtml = post.cover_image_url
          ? `<div class="aspect-[16/10] w-full overflow-hidden bg-stone-100 border-b border-[#E4E0D6]">
               <img src="${escapeHtml(post.cover_image_url)}" alt="${escapeHtml(post.title)}" loading="lazy"
                 class="w-full h-full object-cover group-hover:scale-[1.03] transition duration-500"
                 onerror="this.parentElement.innerHTML='<div class=\\'w-full h-full editorial-pattern flex items-center justify-center font-serif-editorial text-4xl text-stone-400\\'>${cat.monogram}</div>'" />
             </div>`
          : `<div class="aspect-[16/10] w-full editorial-pattern border-b border-[#E4E0D6] flex flex-col items-center justify-center relative overflow-hidden">
               <span class="font-serif-editorial text-5xl font-light opacity-25 select-none" style="color:${cat.accentHex}">${cat.monogram}</span>
               <span class="font-mono-meta text-[10px] uppercase tracking-[0.2em] text-stone-400 mt-1">${escapeHtml(post.format)}</span>
             </div>`;

        return `
          <a href="./viewer.html?id=${post.id}" class="editorial-card group rounded-lg overflow-hidden flex flex-col justify-between">
            <div>
              ${coverHtml}
              <div class="p-5">
                <div class="flex items-center justify-between gap-2 mb-3">
                  <span class="inline-flex items-center gap-1.5 text-[11px] font-medium px-2.5 py-0.5 rounded-full border ${cat.badgeClass}">
                    ${icon(cat.iconKey, 'w-3 h-3')}
                    ${escapeHtml(catName)}
                  </span>
                  <span class="font-mono-meta text-[11px] uppercase text-stone-400">${escapeHtml(post.original_lang)}</span>
                </div>
                <h3 class="font-serif-editorial text-xl font-semibold text-stone-900 leading-snug line-clamp-2 group-hover:text-stone-600 transition">
                  ${escapeHtml(post.title)}
                </h3>
              </div>
            </div>
            <div class="px-5 py-3 border-t border-[#F0EDE6] flex items-center justify-between text-xs text-stone-500">
              <span class="truncate max-w-[65%]">${escapeHtml(sub)}</span>
              <span class="font-mono-meta text-[11px] text-stone-400">${dateStr}</span>
            </div>
          </a>
        `;
      }).join('');
    }

    async function handleBatchAutoClassify() {
      const myPosts = allPosts.filter(p => p.user_id === currentUser?.id);
      if (!myPosts.length) return;
      if (!confirm(`將自動分析您發布的 ${myPosts.length} 篇文章並更新分類，確定執行嗎？`)) return;

      const statusEl = document.getElementById('autoClassifyStatus');
      let updatedCount = 0;
      for (let i = 0; i < myPosts.length; i++) {
        const post = myPosts[i];
        if (statusEl) statusEl.textContent = `${i + 1} / ${myPosts.length}...`;
        const result = autoClassifyPost(post.title, post.raw_text || '');
        try {
          const updated = await updatePostCategory(post.id, result.category, result.subcategory);
          const idx = allPosts.findIndex(p => p.id === post.id);
          if (idx !== -1) allPosts[idx] = updated;
          updatedCount++;
        } catch (err) {
          console.error(err);
        }
      }
      renderView();
      alert(`完成！已更新 ${updatedCount} 篇文章分類。`);
    }

    mountNavbar();
    try {
      [allPosts, currentUser] = await Promise.all([fetchPosts('all'), getCurrentUser()]);
      renderView();
    } catch (err) {
      document.getElementById('cardGrid').innerHTML =
        `<p class="text-red-700 col-span-full text-center py-12 text-sm">載入失敗：${err.message}</p>`;
    }
  </script>
</body>
</html>
