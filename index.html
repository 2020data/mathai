<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>數學與人工智慧知識庫</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="navbar"></div>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex flex-col lg:flex-row gap-6 items-start">
      <!-- 左側：動態分類側邊欄 -->
      <aside id="sidebarContainer" class="w-full lg:w-64 shrink-0"></aside>

      <!-- 右側：目前分類標題與一格一格卡片牆 -->
      <section class="flex-1 w-full">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-5">
          <h1 id="currentViewTitle" class="text-xl font-bold text-slate-800">📚 全部文章</h1>
          <span id="postCountBadge" class="text-xs text-slate-500"></span>
        </div>

        <div id="cardGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5">
          <p class="text-slate-400 col-span-full text-center py-12">載入內容中...</p>
        </div>
      </section>
    </div>
  </main>

  <script type="module">
    import { mountNavbar } from './components/navbar.js';
    import { renderSidebar } from './components/sidebar.js';
    import { getCategoryById } from './config/categories.config.js';
    import { getCurrentUser } from './modules/auth.module.js';
    import { fetchPosts, updatePostCategory } from './modules/db.module.js';
    import { autoClassifyPost } from './modules/classifier.module.js';

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    let allPosts = [];
    let currentUser = null;
    const state = { category: 'all', subcategory: 'all' };

    function renderView() {
      // 1. 渲染側邊欄
      renderSidebar(
        document.getElementById('sidebarContainer'),
        allPosts,
        state,
        {
          currentUser,
          onSelect: (category, subcategory) => {
            state.category = category;
            state.subcategory = subcategory;
            renderView();
          },
          onAutoClassifyAll: handleBatchAutoClassify
        }
      );

      // 2. 篩選符合條件的文章
      const filtered = allPosts.filter(post => {
        if (state.category !== 'all' && post.category !== state.category) return false;
        const sub = (post.subcategory || '').trim() || '未分類';
        if (state.subcategory !== 'all' && sub !== state.subcategory) return false;
        return true;
      });

      // 3. 更新標題列
      const titleEl = document.getElementById('currentViewTitle');
      if (state.category === 'all') {
        titleEl.textContent = '📚 全部文章';
      } else {
        const cat = getCategoryById(state.category);
        titleEl.textContent = state.subcategory === 'all'
          ? `${cat.icon} ${cat.name}`
          : `${cat.icon} ${cat.name} / # ${state.subcategory}`;
      }
      document.getElementById('postCountBadge').textContent = `顯示 ${filtered.length} 篇文章`;

      // 4. 渲染一格一格卡片
      const grid = document.getElementById('cardGrid');
      if (!filtered.length) {
        grid.innerHTML = `<p class="text-slate-400 col-span-full text-center py-12">此分類目前尚無文章。</p>`;
        return;
      }

      grid.innerHTML = filtered.map(post => {
        const cat = getCategoryById(post.category);
        const sub = (post.subcategory || '').trim() || '未分類';
        return `
          <a href="./viewer.html?id=${post.id}" class="flex flex-col justify-between bg-white rounded-xl border border-slate-200 p-5 hover:shadow-md hover:-translate-y-0.5 transition">
            <div>
              <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                <span class="text-xs px-2.5 py-1 rounded-full border ${cat.badgeClass}">${cat.icon} ${cat.name}</span>
                <span class="text-xs uppercase font-mono text-slate-400">${post.format} · ${post.original_lang}</span>
              </div>
              <h2 class="text-lg font-bold text-slate-800 line-clamp-2 mb-3">${escapeHtml(post.title)}</h2>
            </div>
            <div class="flex items-center justify-between pt-3 border-t border-slate-100 text-xs">
              <span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded"># ${escapeHtml(sub)}</span>
              <span class="text-slate-400">${new Date(post.created_at).toLocaleDateString()}</span>
            </div>
          </a>
        `;
      }).join('');
    }

    // 一鍵將登入者自己的文章自動分類並存入資料庫
    async function handleBatchAutoClassify() {
      const myPosts = allPosts.filter(p => p.user_id === currentUser?.id);
      if (!myPosts.length) return;
      if (!confirm(`將自動分析您發布的 ${myPosts.length} 篇文章，重新歸類至「數學 / 人工智慧」並生成子分類，確定執行嗎？`)) return;

      const statusEl = document.getElementById('autoClassifyStatus');
      let updatedCount = 0;

      for (let i = 0; i < myPosts.length; i++) {
        const post = myPosts[i];
        if (statusEl) statusEl.textContent = `分類中 (${i + 1}/${myPosts.length})...`;
        const result = autoClassifyPost(post.title, post.raw_text || '');
        try {
          const updated = await updatePostCategory(post.id, result.category, result.subcategory);
          const idx = allPosts.findIndex(p => p.id === post.id);
          if (idx !== -1) allPosts[idx] = updated;
          updatedCount++;
        } catch (err) {
          console.error(`文章 ${post.title} 分類更新失敗：`, err);
        }
      }

      renderView();
      alert(`自動分類完成！已成功整理 ${updatedCount} 篇文章。`);
    }

    // 初始化載入
    mountNavbar();
    try {
      [allPosts, currentUser] = await Promise.all([
        fetchPosts('all'),
        getCurrentUser()
      ]);
      renderView();
    } catch (err) {
      document.getElementById('cardGrid').innerHTML =
        `<p class="text-red-500 col-span-full text-center py-12">載入失敗：${err.message}</p>`;
    }
  </script>
</body>
</html>
